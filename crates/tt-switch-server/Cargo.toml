[package]
name = "tt-switch-server"
version = "0.1.0"
edition = "2021"
description = "tt-switch HTTP server + CLI（tt-switch 命令启动本地 webui）"

[[bin]]
name = "tt-switch"
path = "src/main.rs"

[dependencies]
tt-switch-core = { path = "../tt-switch-core" }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
serde_json = "1"
rust-embed = "8"
